<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hub</title>
  <link rel="stylesheet" href="style.css">
  <script>try{var t=localStorage.getItem('theme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t;}catch(e){}</script>
</head>
<body class="app-frame">
  <!-- Hub bar around every app on the hub. The app's path is the fragment:
       /app.html#/wiki/… The bar slides away while the app scrolls down (app.js). -->
  <nav class="app-bar" id="app-bar">
    <a href="/" class="app-home" target="_top">⌂ Hub</a>
    <span class="app-title" id="app-title"></span>
    <a class="app-out" id="app-out" href="/" target="_top" title="Open without the hub bar">↗</a>
  </nav>
  <!-- Same origin, so storage and cookies are the app's own. What a frame loses by
       default is fullscreen and the async clipboard, which Excalidraw uses. -->
  <iframe id="app" title="App" allow="fullscreen; clipboard-read; clipboard-write"></iframe>
  <script src="app.js"></script>
</body>
</html>
