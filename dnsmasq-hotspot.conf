# dnsmasq config for Pi hotspot captive portal
# Place at /etc/dnsmasq.d/hotspot.conf (or merge into /etc/dnsmasq.conf)

# Listen on the hotspot interface only
interface=wlan0

# DHCP range — hand out addresses on the hotspot subnet
dhcp-range=192.168.4.2,192.168.4.254,255.255.255.0,24h

# Redirect ALL DNS queries to the Pi's hotspot IP.
# This sends captive portal probes to our server.
address=/#/192.168.4.1

# Hand out the Pi as the gateway and DNS server
dhcp-option=option:router,192.168.4.1
dhcp-option=option:dns-server,192.168.4.1
