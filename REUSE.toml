# SPDX-License-Identifier: MIT
# SPDX-FileCopyrightText: 2026 NomDeTom
# Licences for files that cannot carry a header (REUSE, https://reuse.software).
version = 1

[[annotations]]
path = [
  "apps.d/*.json",
  "addons/*.json",
  "addons/templates/*.json",
  "toolkits/*.json",
  "packages.d/*.json",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 NomDeTom"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = "irate_box/hub/known_radios.json"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 NomDeTom"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = "tests/jsdom/*.json"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 NomDeTom"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = ["web/art/*.webp", "web/art/*.webm", "docs/images/*.webp"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 NomDeTom"
SPDX-License-Identifier = "CC-BY-SA-4.0"

[[annotations]]
path = ["packaging/deb/control", "packaging/deb/copyright"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 NomDeTom"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = "tests/fixtures/**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 NomDeTom"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = "irate_box/hub/common-passwords.txt"
precedence = "aggregate"
SPDX-FileCopyrightText = "2018 Daniel Miessler (SecLists, Passwords/Common-Credentials/10k-most-common.txt)"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = "config/signing/github-web-flow.asc"
precedence = "aggregate"
SPDX-FileCopyrightText = "GitHub, Inc."
SPDX-License-Identifier = "LicenseRef-GitHub-public-key"

[[annotations]]
path = "config/signing/meshtastic-obs.asc"
precedence = "aggregate"
SPDX-FileCopyrightText = "openSUSE Build Service (project network:Meshtastic)"
SPDX-License-Identifier = "LicenseRef-Meshtastic-OBS-public-key"

# The web flasher's install button's notices, and FreeOCD's: a list of what each bundle holds, and the
# texts of the licences those parts come under, quoted.
[[annotations]]
path = ["config/esp-web-tools-NOTICES.txt", "config/freeocd-NOTICES.txt"]
SPDX-FileCopyrightText = "2026 NomDeTom"
SPDX-License-Identifier = "MIT"

# The guide as a book (made from docs/user by ./irate-box guide book) and the hash of what it was made from.
[[annotations]]
path = ["web/guide/irate-box-guide.zim", "web/guide/irate-box-guide.source"]
SPDX-FileCopyrightText = "2026 NomDeTom"
SPDX-License-Identifier = "CC-BY-SA-4.0"

# docusaurus2zim's settings for the guide's book (JSON carries no comment).
[[annotations]]
path = "config/guide-zim.json"
SPDX-FileCopyrightText = "2026 NomDeTom"
SPDX-License-Identifier = "MIT"

# The box's words: the glossary and the words to avoid (docs/dev/writing.md; JSON carries no comment).
[[annotations]]
path = "docs/dev/terms.json"
SPDX-FileCopyrightText = "2026 NomDeTom"
SPDX-License-Identifier = "CC-BY-SA-4.0"

[[annotations]]
path = [
  ".git-blame-ignore-revs",
  ".trunk/.gitignore",
  ".trunk/trunk.yaml",
  ".trunk/configs/**",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 NomDeTom"
SPDX-License-Identifier = "MIT"

# Pictures from Metro UI's icon set (olton/metroui 5.1.20, icons/core/selection.json), one per file.
[[annotations]]
path = "web/icons/*.svg"
precedence = "override"
SPDX-FileCopyrightText = "2012-2025 Serhii Pimenov"
SPDX-License-Identifier = "MIT"
