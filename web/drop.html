<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>File drop · Hub</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/themes.js"></script>
  <link rel="stylesheet" href="/layout.css">
</head>
<body class="drop">
  <header>
    <nav class="head-nav"><a class="head-btn labelled" href="/help.html" title="Quick help"><span class="head-emoji" aria-hidden="true">🛟</span> Help</a><a class="head-btn labelled" href="/" title="Back to the hub"><span class="head-emoji" aria-hidden="true">🏠</span> Hub</a></nav>
    <h1>📥 File drop</h1>
    <p class="subtitle">Upload files for other people to download.</p>
    <div class="theme-picker" role="group" aria-label="Theme"></div>
  </header>

  <section>
    <p class="setting-desc" id="drop-limits">Everyone who can open this page can download these files.</p>
    <label class="drop-name">Display name <input id="drop-by" maxlength="64" placeholder="optional"></label>
    <label class="drop-zone" id="drop-zone">
      <input type="file" id="drop-files" multiple>
      <span><strong>Select files</strong>, or drop them here.</span>
    </label>
    <div class="drop-capture">
      <label class="drop-capture-btn">📷 Take a photo <input type="file" id="drop-photo" accept="image/*" capture="environment"></label>
      <label class="drop-capture-btn">🎙️ Record a voice note <input type="file" id="drop-voice" accept="audio/*" capture></label>
    </div>
    <label class="setting drop-lock">
      <input type="checkbox" id="drop-lock">
      <span>
        <span class="setting-name">🔒 Lock what I upload</span>
        <span class="setting-desc">Devices with the key can delete the file. The administrator can also delete it. A lock does not
        restrict downloads. This browser keeps the key. If you clear the browser data, the lock is lost and the
        file stays until it expires. <a href="/locks.html">Locks on this device</a> shows your keys. You can use a
        key on another device.</span>
      </span>
    </label>
    <ul class="drop-uploads" id="drop-uploads"></ul>
  </section>

  <section>
    <h2>Uploaded files</h2>
    <ul class="drop-list" id="drop-list"><li class="setting-desc">Loading files</li></ul>
  </section>

  <script src="/hub.js"></script>
  <script src="/age.js"></script>
  <script src="/lock.js"></script>
  <script src="/report.js"></script>
  <script src="/drop.js"></script>
</body>
</html>
