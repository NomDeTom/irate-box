<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="drop.head.title">File drop · Hub</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📥</text></svg>">
  <link rel="stylesheet" href="/style.css">
  <script src="/themes.js"></script>
  <link rel="stylesheet" href="/layout.css">
</head>
<body class="drop">
  <header>
    <nav class="head-nav"><a class="head-btn labelled" href="/help.html" title="Quick help" data-i18n-title="drop.header.tip-quick-help" data-i18n="drop.header.help"><span class="head-emoji" aria-hidden="true">🛟</span> Help</a><a class="head-btn labelled" href="/" title="Back to the hub" data-i18n-title="drop.header.tip-back-hub" data-i18n="drop.header.hub"><span class="head-emoji" aria-hidden="true">🏠</span> Hub</a></nav>
    <h1 data-i18n="drop.header.heading">📥 File drop</h1>
    <p class="subtitle" data-i18n="drop.header.subtitle">Upload files for other people to download.</p>
    <div class="theme-picker" role="group" aria-label="Theme" data-i18n-aria-label="drop.header.aria-theme"></div>
  </header>

  <section>
    <p class="setting-desc" id="drop-limits" data-i18n="drop.body.drop-limits">Everyone who can open this page can download these files.</p>
    <label class="drop-name" data-i18n="drop.body.label-display-name">Display name <input id="drop-by" maxlength="64" placeholder="optional" data-i18n-placeholder="drop.body.placeholder-optional"></label>
    <label class="drop-zone" id="drop-zone" data-i18n="drop.body.drop-zone">
      <input type="file" id="drop-files" multiple>
      <span><strong>Select files</strong>, or drop them here.</span>
    </label>
    <div class="drop-capture">
      <label class="drop-capture-btn" data-i18n="drop.body.label-take-photo">📷 Take a photo <input type="file" id="drop-photo" accept="image/*" capture="environment"></label>
      <label class="drop-capture-btn" data-i18n="drop.body.label-record-voice-note">🎙️ Record a voice note <input type="file" id="drop-voice" accept="audio/*" capture></label>
    </div>
    <label class="setting drop-lock" data-i18n="drop.body.label-lock-upload-devices-key">
      <input type="checkbox" id="drop-lock">
      <span>
        <span class="setting-name">🔒 Lock what I upload</span>
        <span class="setting-desc">Devices with the key can delete the file. The administrator can also delete it. A lock does not
        restrict downloads. This browser keeps the key. If you clear the browser data, the lock is lost and the
        file stays until it expires. <a href="/locks.html">Locks on this device</a> shows your keys. You can use a
        key on another device.</span>
      </span>
    </label>
    <ul class="drop-uploads" id="drop-uploads"></ul>
  </section>

  <section>
    <h2 data-i18n="drop.body.heading-uploaded-files">Uploaded files</h2>
    <ul class="drop-list" id="drop-list"><li class="setting-desc" data-i18n="drop.body.loading-files">Loading files</li></ul>
  </section>

  <script src="/i18n.js"></script>
  <script src="/hub.js"></script>
  <script src="/age.js"></script>
  <script src="/lock.js"></script>
  <script src="/report.js"></script>
  <script src="/drop.js"></script>
</body>
</html>
