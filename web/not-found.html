<!-- The box's page for an address it does not have: the hub's own 404 for a browser, and the web server's (nginx,
     Caddy) for a missing file or an app switched off. Static, so it shows whichever answers. -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="not-found.head.title">Not on this box · Hub</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🦀</text></svg>">
  <link rel="stylesheet" href="/style.css">
  <script src="/themes.js"></script>
  <link rel="stylesheet" href="/layout.css">
</head>
<body class="help not-found">
  <header>
    <nav class="head-nav"><a class="head-btn labelled" href="/" title="Back to the hub" data-i18n-title="not-found.header.tip-back-hub" data-i18n="not-found.header.hub"><span class="head-emoji" aria-hidden="true">🏠</span> Hub</a></nav>
    <h1 data-i18n="not-found.header.heading">Not on this box</h1>
    <p class="subtitle" data-i18n="not-found.header.subtitle">This box has no page at that address.</p>
    <div class="theme-picker" role="group" aria-label="Theme" data-i18n-aria-label="not-found.header.aria-theme"></div>
  </header>

  <section class="krab-figure">
    <img src="/art/krab-confused.webp" alt="" width="240" height="240">
    <p data-i18n="not-found.body.what">Check the address. It can also belong to an app that is not set up on this box yet.</p>
    <p><a class="action-btn primary" href="/" data-i18n="not-found.body.back">Back to the hub</a></p>
  </section>

  <script src="/i18n.js"></script>
</body>
</html>
