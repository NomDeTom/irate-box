<html lang="en" class="art-page">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Services · Hub</title>
  <link rel="stylesheet" href="style.css">
  <script>try{var t=localStorage.getItem('theme');if(t==='light'||t==='dark'||t==='cybercore')document.documentElement.dataset.theme=t;}catch(e){}</script>
</head>
<body data-art="controller">
  <!-- Read-only and public: the same facts /status gives every page. Starting and
       stopping stays with ttyd and hubctl, behind the admin login. -->
  <header class="sub-header">
    <nav class="head-nav"><a class="head-btn" href="/" title="Back to the hub" aria-label="Back to the hub">🏠</a><a class="head-btn labelled" href="/help.html" title="Quick help"><span class="head-emoji" aria-hidden="true">🛟</span> Help</a></nav>
    <h1>Services</h1>
    <p class="subtitle">What is on the box, and what is running.</p>
    <div class="theme-picker" role="group" aria-label="Theme">
      <span class="theme-label" aria-hidden="true">Theme</span>
      <button type="button" data-theme-choice="light" title="Light">☀️</button>
      <button type="button" data-theme-choice="dark" title="Dark">🌙</button>
      <button type="button" data-theme-choice="cybercore" title="Cybercore">🏴‍☠️</button>
      <button type="button" data-theme-choice="auto" title="Follow system">Auto</button>
    </div>
  </header>

  <section class="item-section">
    <ul class="item-list service-list" id="service-list">
      <li class="services-note">Asking the box…</li>
    </ul>
    <p class="services-note" id="services-note" hidden></p>
  </section>

  <section class="item-section" id="system-section" hidden>
    <h2>Box</h2>
    <ul class="item-list" id="system-list"></ul>
  </section>

  <!-- The controller at its desk, as on /admin's Box and System panes (style.css). -->
  <div class="admin-art" aria-hidden="true"><span class="art-lamps"><i style="--g:0"></i><i style="--g:1"></i><i style="--g:2"></i><i style="--g:3"></i><i style="--g:4"></i><i style="--g:5"></i><i style="--g:6"></i><i style="--g:7"></i><i style="--g:8"></i><i style="--g:9"></i></span></div>
  <script src="hub.js"></script>
  <script src="services.js"></script>
</body>
</html>
