<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="themes.head.title">Themes · Hub</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎨</text></svg>">
  <link rel="stylesheet" href="/style.css">
  <script src="/themes.js"></script>
  <link rel="stylesheet" href="/layout.css">
</head>
<body>
  <!-- The Themes tile's page (apps.d/27-themes.json). An administrator sets its access (Guests, Users, Administrators or Disabled) on /admin; the 🎨 in every page's header stays either way. The list is themes.js's. -->
  <header class="sub-header">
    <nav class="head-nav"><a class="head-btn labelled" href="/help.html" title="Quick help" data-i18n-title="themes.header.tip-quick-help" data-i18n="themes.header.help"><span class="head-emoji" aria-hidden="true">🛟</span> Help</a><a class="head-btn labelled" href="/" title="Back to the hub" data-i18n-title="themes.header.tip-back-hub" data-i18n="themes.header.hub"><span class="head-emoji" aria-hidden="true">🏠</span> Hub</a></nav>
    <h1 data-i18n="themes.header.heading">🎨 Themes</h1>
    <p class="subtitle" data-i18n="themes.header.subtitle">Theme on this device. This browser saves your selection. It does not change the hub for other people.</p>
    <div class="theme-picker" role="group" aria-label="Theme" data-i18n-aria-label="themes.header.aria-theme"></div>
  </header>

  <section class="item-section">
    <h2 id="theme-list-title" data-i18n="themes.body.theme-list-title">Theme mode</h2>
    <ul class="item-list" id="theme-list" role="radiogroup" aria-labelledby="theme-list-title"></ul>
  </section>
  <section class="item-section">
    <h2 id="palette-list-title" data-i18n="themes.body.palette-list-title">Light and dark palettes</h2>
    <ul class="item-list" id="palette-list" role="radiogroup" aria-labelledby="palette-list-title"></ul>
  </section>

  <script src="/i18n.js"></script>
  <script src="/themes-page.js"></script>
  <script src="/hub.js"></script>
</body>
</html>
