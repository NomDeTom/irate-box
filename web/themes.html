<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Themes · Hub</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/themes.js"></script>
  <link rel="stylesheet" href="/layout.css">
</head>
<body>
  <!-- The Themes tile's page (apps.d/27-themes.json). An administrator sets its access (Guests, Users, Administrators or Disabled) on /admin; the 🎨 in every page's header stays either way. The list is themes.js's. -->
  <header class="sub-header">
    <nav class="head-nav"><a class="head-btn labelled" href="/help.html" title="Quick help"><span class="head-emoji" aria-hidden="true">🛟</span> Help</a><a class="head-btn labelled" href="/" title="Back to the hub"><span class="head-emoji" aria-hidden="true">🏠</span> Hub</a></nav>
    <h1>🎨 Themes</h1>
    <p class="subtitle">Theme on this device. This browser saves your selection. It does not change the hub for other people.</p>
    <div class="theme-picker" role="group" aria-label="Theme"></div>
  </header>

  <section class="item-section">
    <h2 id="theme-list-title">Theme mode</h2>
    <ul class="item-list" id="theme-list" role="radiogroup" aria-labelledby="theme-list-title"></ul>
  </section>
  <section class="item-section">
    <h2 id="palette-list-title">Light and dark palettes</h2>
    <ul class="item-list" id="palette-list" role="radiogroup" aria-labelledby="palette-list-title"></ul>
  </section>

  <script src="/themes-page.js"></script>
  <script src="/hub.js"></script>
</body>
</html>
