# Weekly: the versions irate-box pins, against their GitHub advisories, OSV and the security wording in newer
# release notes. The script opens or updates one issue per behind-and-flagged pin, and closes it when the pin
# catches up. CI only: nothing on the box contacts these hosts.
name: Pin advisories
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
permissions:
  contents: read
  issues: write
concurrency:
  group: pin-advisories
  cancel-in-progress: false
jobs:
  pins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Watch the pins
        run: python3 scripts/pin-advisories.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
