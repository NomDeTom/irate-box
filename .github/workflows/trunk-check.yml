# On every pull request: trunk check (.trunk/trunk.yaml: ruff, shellcheck, prettier and the rest) on the
# files the pull request changes. It compares against the base branch, so only issues the pull request
# adds fail it; the ones already there do not.
name: Trunk check
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: trunk-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true
jobs:
  trunk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: trunk-io/trunk-action@e1234e67a86010d61ddac8d8ebf4b783e2ffd2fa # v2.0.0
