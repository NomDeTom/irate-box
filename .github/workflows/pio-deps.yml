# Build the per-family PlatformIO dependency bundles a Meshtastic release does not publish.
# Workflow dispatch: choose the Meshtastic tag and the environments (PlatformIO target names);
# it checks out meshtastic/firmware at the tag, installs the tools for each environment, runs
# irate_box.hub.pio_bundle and keeps/attaches pio-deps-<env>-<tag>.zip. It needs the network and
# can run for a long time on the larger ESP32 targets.
name: Meshtastic build bundles
# checkov:skip=CKV_GHA_7: the operator chooses the release tag and environments for this manual job
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Meshtastic release tag (for example v2.8.1.8e6a88d)
        required: true
        type: string
      envs:
        description: Comma-separated PlatformIO environments (for example heltec-v3,rak4631)
        required: true
        default: heltec-v3,rak4631
        type: string
      platformio:
        description: PlatformIO version to install
        required: false
        default: 6.1.19
        type: string
      pio_package:
        description: platformio or pioarduino
        required: false
        default: platformio
        type: string
      release_tag:
        description: Optional existing release in this repository to attach the bundles to
        required: false
        default: ""
        type: string
permissions:
  contents: write
jobs:
  bundles:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: The box's bundle tool
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: box
      - name: Meshtastic firmware at the tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: meshtastic/firmware
          ref: ${{ inputs.tag }}
          path: firmware
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: PlatformIO
        run: pip install --disable-pip-version-check "${{ inputs.pio_package }}==${{ inputs.platformio }}"
      - name: Install each environment's tools and pack the bundle
        working-directory: firmware
        env:
          BUNDLE_OUT: ${{ runner.temp }}/bundles
          TAG: ${{ inputs.tag }}
          ENVS: ${{ inputs.envs }}
          PIO_VERSION: ${{ inputs.platformio }}
        run: |
          set -euo pipefail
          "$GITHUB_WORKSPACE/box/scripts/pio-deps-release.sh" "$TAG" "$ENVS" "$PIO_VERSION" "$BUNDLE_OUT"
      - name: Keep the bundles
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pio-deps-${{ inputs.tag }}
          path: ${{ runner.temp }}/bundles/*.zip
          if-no-files-found: error
          retention-days: 14
      - name: Attach to a release
        if: inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          BUNDLE_OUT: ${{ runner.temp }}/bundles
        run: |
          set -euo pipefail
          gh release view "$RELEASE_TAG" >/dev/null
          gh release upload "$RELEASE_TAG" "$BUNDLE_OUT"/*.zip --clobber
