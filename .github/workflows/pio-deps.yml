# Build the per-family PlatformIO dependency bundles a Meshtastic release does not publish.
#
# Every day it looks for stable meshtastic/firmware releases that have no pio-deps-<tag> release
# here yet, and builds one representative target per family for each: platformio-deps-<family>-<tag>.zip,
# beside pio-deps-sha256.json. A box proving a tag downloads a bundle with a SHA-256, and its
# proving run is the check that the published bundle really builds offline.
#
# Workflow dispatch remains for one tag: choose the environments (PlatformIO target names); it keeps
# pio-deps-<env>-<tag>.zip. It needs the network and can run for a long time on the larger ESP32
# targets.
name: Meshtastic build bundles
# checkov:skip=CKV_GHA_7: the operator chooses the release tag and environments for this manual job
on:
  schedule:
    - cron: 17 3 * * *
  workflow_dispatch:
    inputs:
      tag:
        description: Meshtastic release tag (for example v2.8.1.8e6a88d)
        required: true
        type: string
      envs:
        description: Comma-separated PlatformIO environments (for example heltec-v3,rak4631)
        required: true
        default: heltec-v3,rak4631
        type: string
      platformio:
        description: PlatformIO version to install
        required: false
        default: 6.1.19
        type: string
      pio_package:
        description: platformio or pioarduino
        required: false
        default: platformio
        type: string
      release_tag:
        description: Optional existing release in this repository to attach the bundles to
        required: false
        default: ""
        type: string
permissions:
  contents: write
jobs:
  find:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tags: ${{ steps.find.outputs.tags }}
    steps:
      - name: Stable Meshtastic tags with no bundle release here yet
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, subprocess

          def api(path):
              return json.loads(subprocess.check_output(["gh", "api", path], text=True))

          releases = api("repos/meshtastic/firmware/releases?per_page=30")
          mine = {r["tag_name"] for r in api(f"repos/{os.environ['REPO']}/releases?per_page=100")}
          tags = [
              r["tag_name"]
              for r in releases
              if not r.get("draft") and not r.get("prerelease")
              and f"pio-deps-{r['tag_name']}" not in mine
          ][:6]
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write("tags=" + json.dumps(tags) + "\n")
          print("new tags:", tags)
          PY
  bundles:
    needs: find
    if: always() && (github.event_name != 'schedule' || needs.find.outputs.tags != '[]')
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        tag: ${{ github.event_name == 'schedule' && fromJSON(needs.find.outputs.tags) || fromJSON(format('["{0}"]', github.event.inputs.tag)) }}
    steps:
      - name: The box's bundle tool
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: box
      - name: Meshtastic firmware at the tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: meshtastic/firmware
          ref: ${{ github.event_name == 'schedule' && matrix.tag || inputs.tag }}
          path: firmware
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: PlatformIO
        env:
          PIO_PACKAGE: ${{ inputs.pio_package || 'platformio' }}
          PIO_VERSION: ${{ inputs.platformio || '6.1.19' }}
        run: |
          set -euo pipefail
          case "$PIO_PACKAGE" in
            platformio|pioarduino) ;;
            *) echo "pio_package must be platformio or pioarduino, not: $PIO_PACKAGE" >&2; exit 1 ;;
          esac
          pip install --disable-pip-version-check "$PIO_PACKAGE==$PIO_VERSION"
      - name: Install one target per family and pack each bundle
        if: github.event_name == 'schedule'
        working-directory: firmware
        env:
          BUNDLE_OUT: ${{ runner.temp }}/bundles
          TAG: ${{ matrix.tag }}
          PIO_VERSION: ${{ inputs.platformio || '6.1.19' }}
        run: |
          set -euo pipefail
          bash "$GITHUB_WORKSPACE/box/scripts/pio-deps-families.sh" "$TAG" "$BUNDLE_OUT" "$PIO_VERSION"
      - name: Install each environment's tools and pack the bundle
        if: github.event_name != 'schedule'
        working-directory: firmware
        env:
          BUNDLE_OUT: ${{ runner.temp }}/bundles
          TAG: ${{ inputs.tag }}
          ENVS: ${{ inputs.envs }}
          PIO_VERSION: ${{ inputs.platformio }}
        run: |
          set -euo pipefail
          "$GITHUB_WORKSPACE/box/scripts/pio-deps-release.sh" "$TAG" "$ENVS" "$PIO_VERSION" "$BUNDLE_OUT"
      - name: Record each bundle's SHA-256
        env:
          BUNDLE_OUT: ${{ runner.temp }}/bundles
        run: |
          set -euo pipefail
          cd "$BUNDLE_OUT"
          python3 - <<'PY'
          import hashlib, json, pathlib
          files = {p.name: hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(pathlib.Path(".").glob("*.zip"))}
          if not files:
              raise SystemExit("no bundles to record")
          pathlib.Path("pio-deps-sha256.json").write_text(json.dumps({"files": files}, indent=2, sort_keys=True) + "\n")
          PY
      - name: Keep the bundles
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pio-deps-${{ github.event_name == 'schedule' && matrix.tag || inputs.tag }}
          path: |
            ${{ runner.temp }}/bundles/*.zip
            ${{ runner.temp }}/bundles/pio-deps-sha256.json
          if-no-files-found: error
          retention-days: 14
      - name: Publish the bundles as a release
        if: github.event_name == 'schedule' || inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'schedule' && format('pio-deps-{0}', matrix.tag) || inputs.release_tag }}
          TAG: ${{ github.event_name == 'schedule' && matrix.tag || inputs.tag }}
          BUNDLE_OUT: ${{ runner.temp }}/bundles
        run: |
          set -euo pipefail
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            printf 'PlatformIO build caches for Meshtastic %s: one representative target per family, and their SHA-256.\n' "$TAG" \
              | gh release create "$RELEASE_TAG" --title "Build caches for $TAG" --notes-file -
          fi
          gh release upload "$RELEASE_TAG" "$BUNDLE_OUT"/*.zip "$BUNDLE_OUT"/pio-deps-sha256.json --clobber
