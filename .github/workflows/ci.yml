# SPDX-FileCopyrightText: 2026 NomDeTom
# On every push and pull request: the licences (REUSE), bandit over every file, the tests that need only
# Python, the pages in jsdom, then the .deb (packaging/deb/build.sh), kept as the run's artifact. A tag v*
# also puts the .deb on that tag's release.
name: CI
on:
  push:
    branches: [main]
    tags: [v*]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
# A newer push to a pull request's branch cancels its older run, as Trunk check does; pushes to main and tags
# each keep their own run (run_id).
concurrency:
  group: ci-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Licences (REUSE)
        run: pipx run reuse lint
      - name: Security lint (bandit, every file)
        # Trunk's bandit sees only what a pull request changes; this sees what is already there too.
        # The version and skips are Trunk's (.trunk/trunk.yaml, .trunk/configs/.bandit); tests use fixtures on purpose.
        run: pipx run bandit==1.9.4 -q -r . -x ./tests,./.trunk --ini .trunk/configs/.bandit
      - name: Tests (tests/run.sh)
        run: tests/run.sh
      - name: Shell scripts parse
        run: for f in install.sh uninstall.sh scripts/*.sh packaging/deb/build.sh tests/run.sh tests/container/*.sh; do bash -n "$f"; done
  pages:
    # The pages in jsdom (tests/jsdom/run.sh), with a hub of this checkout for the ones that need one.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Page tests (tests/jsdom/run.sh; jsdom.sh installs the pinned jsdom, outside the repository)
        run: JSDOM_CACHE="$RUNNER_TEMP/jsdom" tests/jsdom/run.sh
  spacing:
    # The vertical-spacing audit over every admin pane, in headless Chromium (tests/browser/spacing-audit.sh): about
    # two minutes once Chromium is installed, so it is a job of its own. No accepted findings: the sweep's eight were
    # fixed; add one only for a false positive, with why, and keep the list short.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Playwright's Chromium
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.62.1
          npx playwright install --with-deps chromium
      - name: Spacing audit (tests/browser/spacing-audit.sh)
        run: PLAYWRIGHT="$PWD/node_modules/playwright" tests/browser/spacing-audit.sh
  deb:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Build the .deb
        id: build
        run: echo "deb=$(packaging/deb/build.sh dist)" >> "$GITHUB_OUTPUT"
      - name: What is in it
        run: dpkg-deb --info "${{ steps.build.outputs.deb }}" && dpkg-deb --contents "${{ steps.build.outputs.deb }}" | wc -l
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: irate-box-deb
          path: dist/*.deb
      - name: On a tag, attach it to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --generate-notes; gh release upload "$GITHUB_REF_NAME" dist/*.deb --clobber
