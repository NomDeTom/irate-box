# On every push and pull request: the licences (REUSE), the tests that need only Python, the pages in jsdom,
# then the .deb (packaging/deb/build.sh), kept as the run's artifact. A tag v* also puts the
# .deb on that tag's release.
name: CI
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Licences (REUSE)
        run: pipx run reuse lint
      - name: Tests (tests/run.sh)
        run: tests/run.sh
      - name: Shell scripts parse
        run: for f in install.sh uninstall.sh scripts/*.sh packaging/deb/build.sh tests/run.sh tests/container/*.sh; do bash -n "$f"; done
  pages:
    # The pages in jsdom (tests/jsdom/run.sh), with a hub of this checkout for the ones that need one.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: jsdom (pinned, outside the repository)
        run: npm install --no-save --prefix "$RUNNER_TEMP/jsdom" jsdom@22.1.0
      - name: Page tests (tests/jsdom/run.sh)
        run: NODE_PATH="$RUNNER_TEMP/jsdom/node_modules" tests/jsdom/run.sh
  deb:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Build the .deb
        id: build
        run: echo "deb=$(packaging/deb/build.sh dist)" >> "$GITHUB_OUTPUT"
      - name: What is in it
        run: dpkg-deb --info "${{ steps.build.outputs.deb }}" && dpkg-deb --contents "${{ steps.build.outputs.deb }}" | wc -l
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: irate-box-deb
          path: dist/*.deb
      - name: On a tag, attach it to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --generate-notes; gh release upload "$GITHUB_REF_NAME" dist/*.deb --clobber
