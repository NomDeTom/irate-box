name: build-meshtasticd-armhf

on:
  workflow_dispatch:
  push:
    branches:
      - build/meshtasticd-armhf

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - name: Build native-tft in armhf Debian trixie
        run: |
          docker run --rm --platform linux/arm/v7 \
            -v "$GITHUB_WORKSPACE":/work -w /work \
            debian:trixie bash -euc '
              apt-get update
              apt-get install -y --no-install-recommends \
                build-essential ca-certificates git python3 python3-pip python3-venv \
                pkg-config cmake lsb-release tar gzip openssl \
                python3-protobuf python3-grpcio \
                libgpiod-dev libyaml-cpp-dev libjsoncpp-dev libbluetooth-dev \
                libsdbus-c++-dev libusb-1.0-0-dev libi2c-dev libuv1-dev \
                libssl-dev libulfius-dev liborcania-dev libavahi-client-dev \
                libx11-dev libinput-dev libxkbcommon-dev libxkbcommon-x11-dev \
                libsqlite3-dev libsdl2-dev libcurl4-gnutls-dev libnotify-dev \
                libbsd-dev libudev-dev
              pip3 install --break-system-packages platformio

              git clone --depth 1 https://github.com/meshtastic/firmware.git firmware
              cd firmware
              echo "firmware commit: $(git rev-parse HEAD)" | tee ../firmware-commit.txt

              python3 - <<"PY"
          import re
          p = "src/graphics/tftSetup.cpp"
          s = open(p).read()
          s2 = re.sub(
              r"portduino_config\.displayPanel == ili9486\s*\|\|\s*portduino_config\.displayPanel == ili9488",
              "portduino_config.displayPanel == ili9486",
              s,
          )
          if s2 == s:
              raise SystemExit("dlen patch did not apply")
          open(p, "w").write(s2)
          PY

              python3 - <<"PY"
          p = "variants/native/portduino/platformio.ini"
          s = open(p).read()
          old = "${device-ui_base.lib_deps}"
          new = "${device-ui_base.lib_deps}\n  lovyan03/LovyanGFX@1.2.28"
          if old not in s:
              raise SystemExit("native-tft lib_deps anchor not found")
          open(p, "w").write(s.replace(old, new, 1))
          PY

              python3 - <<"PY"
          p = "src/graphics/tftSetup.cpp"
          s = open(p).read()
          anchor = '#include "configuration.h"'
          if s.count(anchor) != 1:
              raise SystemExit("SPI include anchor is not unique")
          if "#include <SPI.h>" not in s:
              s = s.replace(anchor, anchor + "\n#include <SPI.h>", 1)
          open(p, "w").write(s)
          PY

              python3 - <<"PY"
          p = "src/graphics/tftSetup.cpp"
          s = open(p).read()
          anchor = """    if (portduino_config.displayPanel != no_screen) {
        DisplayDriverConfig displayConfig;"""
          if s.count(anchor) != 1:
              raise SystemExit("SPI.begin anchor is not unique or missing")
          insert = """    if (portduino_config.displayPanel != no_screen) {
        SPI.begin(portduino_config.display_spi_dev.c_str(), portduino_config.displayBusFrequency);
        DisplayDriverConfig displayConfig;"""
          open(p, "w").write(s.replace(anchor, insert, 1))
          PY

              pio run -e native-tft -j 1
            '

      - uses: actions/upload-artifact@v4
        with:
          name: meshtasticd-armhf
          path: |
            firmware/.pio/build/native-tft/meshtasticd
            firmware-commit.txt
          if-no-files-found: error
