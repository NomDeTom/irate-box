# This file controls the behavior of Trunk: https://docs.trunk.io/cli
# To learn more about the format of this file, see https://docs.trunk.io/reference/trunk-yaml
version: 0.1
cli:
  version: 1.25.0
# Trunk provides extensibility via plugins. (https://docs.trunk.io/plugins)
plugins:
  sources:
    - id: trunk
      ref: v1.11.0
      uri: https://github.com/trunk-io/plugins
# Many linters and tools depend on runtimes - configure them here. (https://docs.trunk.io/runtimes)
runtimes:
  enabled:
    - node@22.16.0
    - python@3.14.4
# This is the section where you manage your linters. (https://docs.trunk.io/check/configuration)
lint:
  # black and isort: ruff formats Python and sorts its imports.
  # prettier and shfmt: off until JS/HTML/CSS/JSON/Markdown and shell get a reformat of their own
  # (223 files, +38k/-19k). While on, the format-on-commit hook would rewrite every file a commit touched.
  disabled:
    - black
    - isort
    - prettier
    - shfmt
  enabled:
    - actionlint@1.7.12
    - bandit@1.9.4
    - checkov@3.3.29
    - git-diff-check
    - hadolint@2.15.1
    - markdownlint@0.49.1
    # The hub's page scripts (web/*.js), as .oxlintrc.json says. Lint only: oxfmt would reformat
    # them all, as prettier would. Not ESLint: it dragged out every mermaid update until it ran
    # out of memory.
    - oxlint@1.87.0:
        commands: [lint]
    - pinact@4.0.0
    - ruff@0.17.1:
        commands: [lint, format]
    - shellcheck@0.11.0
    - taplo@0.10.0
    - trufflehog@3.99.2
    - yamllint@1.38.0
  ignore:
    # Tests use fixed fake passwords, MD5 for fixtures, /tmp paths and subprocess on purpose.
    - linters: [bandit]
      paths: [tests/**]
    # oxlint is for web/*.js; the rest of the JavaScript runs under Node and has no config yet.
    - linters: [oxlint]
      paths: [tests/**, tools/**, extras/**, web/qrcode.js]
actions:
  disabled:
    - trunk-announce
    - trunk-check-pre-push
  enabled:
    - trunk-fmt-pre-commit
    - trunk-upgrade-available
